name: SportAI Continuous Integration (CI/CD Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Jest Test Suites (19 Automated Tests)
        working-directory: ./backend
        run: npm test

      - name: Run Prompt A/B Benchmark Experiment
        working-directory: ./backend
        run: node test/prompt_ab_benchmark.js

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./webapp
        run: npm ci

      - name: Build Web Application (Strict TypeScript Check)
        working-directory: ./webapp
        run: npm run build

  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: docker compose config
